# Deploy da API no plano gratuito do Render.
# Atenção: no free tier o serviço hiberna após 15 min sem tráfego e leva
# ~1 min para voltar. Veja o README para a alternativa de keep-alive.
services:
  - type: web
    name: rekrutar-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace @rekrutar/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false   # string do Atlas M0 — definir no painel, nunca no git
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false   # https://<portal>.pages.dev,https://<admin>.pages.dev
      - key: PUBLIC_API_URL
        sync: false   # https://rekrutar-api.onrender.com
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
